name: Paper trading validation
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python -m brobs.demo
      - run: python -m brobs.fx_runner --demo --once --db demo_fx.db
      - run: python -m brobs.market_runner --market stock --demo --once --db demo_stock.db
      - run: python -m brobs.market_runner --market crypto --demo --once --db demo_crypto.db
      - run: python -m brobs.fx_runner --demo --once --strategy grok_consensus --db demo_grok_fx.db
      - run: python -m brobs.market_runner --market crypto --demo --once --strategy grok_consensus --db demo_grok_crypto.db
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install backtrader==1.9.78.123
      - run: python -m brobs.fx_research --csv research/data/EURUSD_1h.csv
      - run: python -m brobs.reference --csv research/data/EURUSD_1h.csv
      - run: python -m brobs.fx_optimize --csv research/data/EURUSD_1h.csv --output /tmp/reversion-evaluation.json
      - run: diff research/reversion-evaluation.json /tmp/reversion-evaluation.json
      - run: python -m brobs.market_research --csv research/data/AAPL_1d.csv --market stock --symbol AAPL --output /tmp/stock-evaluation.json
      - run: diff research/stock-strategy-evaluation.json /tmp/stock-evaluation.json
